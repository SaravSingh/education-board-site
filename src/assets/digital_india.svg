<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="120" height="60">
  <!-- Digital India Logo Representation -->
  <g transform="translate(10, 5)">
    <!-- Globe/Wheel motif -->
    <circle cx="30" cy="30" r="22" fill="none" stroke="#0b72b9" stroke-width="4"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#f37021" stroke-width="3"/>
    <circle cx="30" cy="30" r="6" fill="#00a859"/>
    
    <!-- Sunburst lines -->
    <path d="M 30,2 L 30,8 M 30,52 L 30,58 M 2,30 L 8,30 M 52,30 L 58,30" stroke="#f37021" stroke-width="3" stroke-linecap="round"/>

    <!-- Text -->
    <text x="60" y="28" font-family="'Trebuchet MS', Arial, sans-serif" font-size="20" font-weight="900" fill="#0b72b9">Digital</text>
    <text x="60" y="48" font-family="'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="900" fill="#f37021">India</text>
    <text x="60" y="62" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#333333">Power To Empower</text>
  </g>
</svg>
